name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --project unit

  storybook:
    name: Storybook Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npx vitest run --project storybook

      - name: Run Storybook tests under reduced motion
        run: npx vitest run --project storybook-reduced-motion

      # Stories that drive Playwright's real mouse and resize the viewport
      # (.storybook/real-input.ts). Their own project, and their own step,
      # because they need the page's one mouse and one viewport to themselves.
      - name: Run Storybook tests with real input
        run: npx vitest run --project storybook-real-input

      # Checks that read Chromium's accessibility tree (.storybook/ax-tree.ts).
      # Last, and alone: beside other story files the page didn't answer the
      # DevTools protocol in time.
      - name: Run accessibility-tree checks
        run: npx vitest run --project storybook-ax-tree

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build